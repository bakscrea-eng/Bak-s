// Personnages

function person(o) {

// pose : angles en radians. sh = [avant(+), écart(+)], el = flexion(+), hip = avant(+), knee = flexion(+)

const TAGS = [
  { el: mkTag('20:00', 120, 300), tIn: 2.2, tOut: 4.95 },
  { el: mkTag('SAMEDI SOIR', 120, 300), tIn: 8.2, tOut: 10.95 },
];
function mkTag(txt, x, y) { const e = document.createElement('div'); e.className = 'tag'; e.textContent = txt; e.style.left = x + 'px'; e.style.top = y + 'px'; capsEl.appendChild(e); return e; }
const boom = document.createElement('div'); boom.className = 'boom'; boom.textContent = 'SPLASH !'; boom.style.left = '420px'; boom.style.top = '880px'; capsEl.appendChild(boom);
const mid = document.getElementById('mid'), brand = document.getElementById('brand'), slogan = document.getElementById('slogan'), url = document.getElementById('url');
const wipe = document.getElementById('wipe'), flash = document.getElementById('flash');
const sloganWords = 'Tout Thiès, sur *une seule ligne.*'.split(' ').map(w => { const s = document.createElement('span'); s.className = 'w' + (w.startsWith('*') ? ' hl' : ''); s.textContent = w.replace(/\*/g, ''); slogan.appendChild(s); return s; });
const CUTS = [2, 5, 8, 11, 14, 17, 22, 25];

function updateUI(t) {
  for (const c of CAPS) {
    const vis = t >= c.tIn - .01 && t <= c.tOut + .01; c.el.style.opacity = vis ? 1 : 0; if (!vis) continue;
    const out = eo3(lin(t, c.tOut - .18, c.tOut));
    c.bar.style.width = (eoExpo(lin(t, c.tIn, c.tIn + .35)) * 100) + '%';
    const st = c.o.fast ? .035 : .075, du = c.o.fast ? .22 : .34;
    c.words.forEach((w, i) => { const k = eoBack(lin(t, c.tIn + .04 + i * st, c.tIn + .04 + du + i * st));
      w.style.transform = `translateY(${(1 - k) * 70 - out * 60}px) scale(${.5 + .5 * k}) rotate(${(1 - k) * -9}deg)`; w.style.opacity = cl(k * 1.5) * (1 - out); });
    c.bar.style.opacity = 1 - out;
  }
  for (const tg of TAGS) { const k = eoBack(lin(t, tg.tIn, tg.tIn + .35)), out = lin(t, tg.tOut - .15, tg.tOut);
    tg.el.style.opacity = t > tg.tIn && t < tg.tOut ? 1 - out : 0; tg.el.style.transform = `translateX(${(1 - k) * -260}px) rotate(-3deg)`; }
  const bk = eoBack(lin(t, 5.55, 5.85)), bo = lin(t, 6.6, 6.9);
  boom.style.opacity = t > 5.55 && t < 6.9 ? 1 - bo : 0; boom.style.transform = `scale(${.2 + bk * .8}) rotate(${-8 + Math.sin(t * 30) * 2}deg)`;
  // logo au centre de l'écran partagé, sur le dernier clic
  const mk = eoBack(lin(t, 16.4, 16.7)), mo = lin(t, 16.85, 17);
  mid.style.opacity = t > 16.4 && t < 17 ? 1 - mo : 0; mid.style.top = '895px'; mid.style.transform = `scale(${.3 + mk * .7})`;
  // transitions « rail qui déchire »
  let wv = 0, wy = 0; for (const ct of CUTS) { const k = lin(t, ct - .14, ct + .16); if (k > 0 && k < 1) { wv = 1; wy = lerp(H + 300, -820, eio(k)); } }
  wipe.style.opacity = wv; wipe.style.top = wy + 'px'; wipe.style.transform = 'rotate(-8deg)';
  flash.style.opacity = pulse(t, 27.35, .35) * .85;
  document.getElementById('endbg').style.opacity = eo3(lin(t, 26.9, 27.4));
  // fin : nom, slogan, URL (tenus jusqu'à 30 s)
  const bkk = eoBack(lin(t, 27.3, 27.75)); brand.style.opacity = t > 27.3 ? 1 : 0; brand.style.top = '1180px'; brand.style.transform = `translateY(${(1 - bkk) * 80}px) scale(${.7 + .3 * bkk})`;
  slogan.style.top = '1350px'; slogan.style.opacity = t > 27.0 ? 1 : 0;
  sloganWords.forEach((w, i) => { const k = eoBack(lin(t, 27.5 + i * .09, 27.9 + i * .09)); w.style.opacity = cl(k * 1.4); w.style.transform = `translateY(${(1 - k) * 60}px) scale(${.6 + .4 * k})`; });
  const uk = eoBack(lin(t, 27.0, 27.35)); url.style.top = '1560px'; url.style.opacity = t > 27.0 ? 1 : 0; url.style.transform = `scale(${Math.max(.001, uk)})`;
}

// grain léger (déterministe par image)
const grainC = document.getElementById('grain'), gctx = grainC.getContext('2d'); const gimg = gctx.createImageData(540, 960);
function updateGrain(frame) { const r = rng(1000 + frame), d = gimg.data; for (let i = 0; i < d.length; i += 4) { const v = 128 + (r() - .5) * 120; d[i] = d[i + 1] = d[i + 2] = v; d[i + 3] = 255; } gctx.putImageData(gimg, 0, 0); }

// =====================================================================
// Rendu d'une image à l'instant t
// =====================================================================
function renderAt(t, frame = Math.round(t * 30)) {
  let scene, cam;
  if (t < 2) { S1.update(t); scene = S1.s; cam = S1.cam; }
  else if (t < 5) { S2.update(t - 2, 'story', t); scene = S2.s; cam = S2.cam; }
  else if (t < 8) { S3.update(t - 5, 'story', t); scene = S3.s; cam = S3.cam; }
  else if (t < 11) { S4.update(t - 8, 'story', t); scene = S4.s; cam = S4.cam; }
  else if (t < 14) { S5.update(t - 11, 'story', t); scene = S5.s; cam = S5.cam; }
  else if (t < 17) { const sp = renderSplit(t); scene = sp.s; cam = sp.cam; }
  else if (t < 22) { S7.update(t - 17, 'map', t); scene = S7.s; cam = S7.cam; }
  else if (t < 25) { const i = Math.min(3, Math.floor((t - 22) / .75)), lt = t - 22 - i * .75;
    const sc = [S2, S3, S4b, S5][i]; sc.update(lt, 'happy', t); scene = sc.s; cam = sc.cam; }
  else { S8.update(t - 25, 'end', t); scene = S8.s; cam = S8.cam; }
  renderPass.scene = scene; renderPass.camera = cam;
  bloom.strength = (t >= 14 && t < 17) ? .35 : (t >= 25 ? .25 : .55);
  composer.render();
  updateUI(t); updateGrain(frame);
}

await document.fonts.load('800 40px Poppins'); await document.fonts.load('600 40px Poppins');
window.renderAt = renderAt; window.DUREE = DUREE;
// Pré-compilation des shaders de chaque scène (évite les à-coups)
for (const tt of [.5, 3, 6, 9, 12, 15, 19, 22.3, 23, 23.7, 24.5, 26, 28]) renderAt(tt);
renderAt(0);
window.ready = true;

// Mode aperçu (navigateur) : lecture temps réel avec le son mixé
if (!new URLSearchParams(location.search).has('render')) {
  const stage = document.getElementById('stage');
  const fit = () => { const k = Math.min(innerWidth / W, innerHeight / H); stage.style.transform = `scale(${k})`; }; fit(); addEventListener('resize', fit);
  const btn = document.createElement('div'); btn.id = 'play'; btn.textContent = '▶ Lecture'; document.getElementById('ui').appendChild(btn);
  const audio = new Audio('audio/mix.wav');
  btn.onclick = () => { btn.remove(); audio.currentTime = 0; audio.play(); const t0 = performance.now();
    const loop = () => { const t = audio.currentTime || (performance.now() - t0) / 1000; renderAt(Math.min(t, DUREE - .001)); if (t < DUREE) requestAnimationFrame(loop); }; loop(); };
}
</script>
